<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="KKC Family — Our Roots, Our Story. Explore the KKC family tree, history, and photo gallery." />
    <meta name="theme-color" content="#c8871f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KKC Family" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>KKC Family</title>
    <style>
      /* Pre-React Initial Loading Presentation */
      body {
        margin: 0;
        background-color: #12100e;
        color: #f5f5f4;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      .kkc-entrance {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 45%, rgba(200, 135, 31, 0.22) 0%, rgba(18, 16, 14, 0.95) 60%, #0d0b0a 100%);
        box-sizing: border-box;
      }
      .kkc-medallion {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(180deg, #f5d485 0%, #c8871f 50%, #784807 100%);
        box-shadow: 0 0 35px rgba(200, 135, 31, 0.38);
        margin-bottom: 24px;
        animation: kkc-pulse 2.4s ease-in-out infinite alternate;
      }
      .kkc-medallion-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        background-color: #1c1917;
      }
      .kkc-medallion-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
      .kkc-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 48px;
        font-weight: 700;
        margin: 0 0 6px 0;
        letter-spacing: 0.08em;
        background: linear-gradient(180deg, #fef3c7 0%, #f59e0b 60%, #b45309 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 20px rgba(200, 135, 31, 0.3);
      }
      .kkc-subtitle {
        font-size: 11px;
        font-weight: 600;
        color: #fcd34d;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        margin: 0 0 16px 0;
      }
      .kkc-divider {
        width: 80px;
        height: 1.5px;
        background: linear-gradient(90deg, transparent, #fbbf24, transparent);
        margin: 0 auto 16px auto;
      }
      .kkc-tagline {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 13px;
        color: #d6d3d1;
        margin: 0 0 28px 0;
        opacity: 0.85;
      }
      .kkc-progress-track {
        width: 140px;
        height: 2px;
        background-color: rgba(68, 64, 60, 0.5);
        border-radius: 9999px;
        overflow: hidden;
        margin: 0 auto;
        position: relative;
      }
      .kkc-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, transparent, #fbbf24, transparent);
        animation: kkc-shimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes kkc-pulse {
        from { transform: scale(0.98); box-shadow: 0 0 25px rgba(200, 135, 31, 0.25); }
        to { transform: scale(1.02); box-shadow: 0 0 45px rgba(200, 135, 31, 0.45); }
      }
      @keyframes kkc-shimmer {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="kkc-entrance">
        <div class="kkc-medallion">
          <div class="kkc-medallion-inner">
            <img src="/uploads/founders.jpg" alt="KKC Family Founders" class="kkc-medallion-img" onerror="this.style.display='none'" />
          </div>
        </div>
        <h1 class="kkc-title">K K C</h1>
        <p class="kkc-subtitle">Family Heritage</p>
        <div class="kkc-divider"></div>
        <p class="kkc-tagline">Our Roots, Our Story, Our Living Legacy</p>
        <div class="kkc-progress-track">
          <div class="kkc-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
